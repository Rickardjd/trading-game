<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Game — Leaderboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Trading Game Leaderboard</h1>
  <div id="timerBar" class="timer-bar" hidden>
    <div id="timerValue" class="timer-value">00:00</div>
    <div id="timerLabel" class="timer-label">Time remaining</div>
  </div>
  <div id="bars" class="bars"></div>
  <div id="podium" class="podium" hidden>
    <h2 class="podium-title">Final results</h2>
    <div class="podium-stage">
      <div class="podium-place place-2" data-place="2">
        <div class="podium-name"></div>
        <div class="podium-score"></div>
        <div class="podium-block">2</div>
      </div>
      <div class="podium-place place-1" data-place="1">
        <div class="podium-name"></div>
        <div class="podium-score"></div>
        <div class="podium-block">1</div>
      </div>
      <div class="podium-place place-3" data-place="3">
        <div class="podium-name"></div>
        <div class="podium-score"></div>
        <div class="podium-block">3</div>
      </div>
    </div>
    <div id="podiumRest" class="podium-rest"></div>
  </div>
  <div id="flash" class="flash" hidden></div>
  <button id="soundBtn" class="sound-btn"></button>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/timer-client.js"></script>
  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
