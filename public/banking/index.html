<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Game — Banking Station</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Trading Game — Banking</div>
    <div class="station-id" id="stationLabel"></div>
    <button id="renameStationBtn" class="ghost-btn">Rename station</button>
    <button id="undoBtn" class="danger-btn">Undo last transaction</button>
  </header>

  <main>
    <section class="panel timer-panel">
      <div class="timer-panel-row">
        <div class="timer-display">
          <span id="gameTimerValue" class="timer-readout">00:00</span>
          <span id="gameTimerStatus" class="timer-status"></span>
        </div>
        <div class="timer-controls">
          <input id="timerMinutes" type="number" min="1" max="240" placeholder="Minutes" class="timer-minutes" />
          <button id="timerStartBtn" class="ghost-btn">Set &amp; start</button>
          <button id="timerPauseBtn" class="ghost-btn" hidden>Pause</button>
          <button id="timerResumeBtn" class="ghost-btn" hidden>Resume</button>
          <button id="timerResetBtn" class="ghost-btn">Reset</button>
        </div>
      </div>
    </section>

    <input id="scanInput" class="scan-input" type="text" autocomplete="off" placeholder="Scan team card (or a tool being returned)…" />

    <div id="message" class="message" hidden></div>

    <section id="teamPanel" class="panel" hidden>
      <div class="team-row">
        <span id="teamSwatch" class="swatch"></span>
        <div>
          <div id="teamName" class="team-name"></div>
          <div id="teamBalance" class="team-balance"></div>
        </div>
        <button id="renameTeamBtn" class="ghost-btn" style="margin-left:auto">Rename team</button>
        <button id="doneTeamBtn" class="ghost-btn">Done with this team</button>
      </div>
      <div id="teamHires" class="team-hires" hidden></div>
    </section>

    <section id="activityPanel" class="panel" hidden>
      <div class="activity-header">
        <span id="activityCode" class="chip"></span>
        <span id="activityName" class="activity-name"></span>
      </div>
      <div id="activityMeta" class="activity-meta"></div>
      <div class="criteria-label">Examiner criteria</div>
      <div id="activityCriteria" class="criteria"></div>

      <textarea id="examinerNotes" placeholder="Examiner notes (optional)"></textarea>

      <div class="chit-prompt">Scan the assessor's grade chit to award — or, if there isn't one, choose:</div>
      <div class="award-buttons">
        <button class="award-btn poor" data-level="poor">Poor</button>
        <button class="award-btn standard" data-level="standard">Standard</button>
        <button class="award-btn excellent" data-level="excellent">Excellent</button>
        <button class="award-btn not-met" data-level="not_met">Not met (0)</button>
      </div>
    </section>

    <section id="purchasePanel" class="panel" hidden>
      <div class="activity-header">
        <span class="chip">BUY</span>
        <span id="purchaseName" class="activity-name"></span>
      </div>
      <div id="purchasePrice" class="activity-meta"></div>
      <div class="qty-row">
        <label for="purchaseQty">Quantity</label>
        <button type="button" class="ghost-btn qty-btn" data-step="-1">−</button>
        <input id="purchaseQty" type="number" min="1" max="50" value="1" class="qty-input" />
        <button type="button" class="ghost-btn qty-btn" data-step="1">+</button>
      </div>
      <div class="shop-actions">
        <button id="purchaseConfirmBtn" class="award-btn standard"></button>
        <button class="award-btn not-met shop-cancel">Cancel</button>
      </div>
    </section>

    <section id="hirePanel" class="panel" hidden>
      <div class="activity-header">
        <span class="chip">HIRE</span>
        <span id="hireName" class="activity-name"></span>
      </div>
      <div id="hireTerms" class="criteria"></div>
      <div class="shop-actions">
        <button id="hireConfirmBtn" class="award-btn standard"></button>
        <button class="award-btn not-met shop-cancel">Cancel</button>
      </div>
    </section>

    <section id="returnPanel" class="panel" hidden>
      <div class="activity-header">
        <span class="chip">RETURN</span>
        <span id="returnName" class="activity-name"></span>
      </div>
      <div id="returnDetail" class="activity-meta"></div>
      <div id="returnStatus" class="return-status"></div>
      <div class="shop-actions">
        <button id="returnConfirmBtn" class="award-btn excellent">Check in</button>
        <button class="award-btn not-met shop-cancel">Cancel</button>
      </div>
    </section>

    <section id="rejectPanel" class="panel reject" hidden>
      <div class="reject-title">Already completed — no reward</div>
      <div id="rejectDetail" class="reject-detail"></div>
      <button id="rejectContinueBtn" class="ghost-btn">Scan another activity</button>
    </section>
  </main>

  <div id="screenFlash" class="screen-flash" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/timer-client.js"></script>
  <script src="/shared/hire-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
