<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Game — Leader Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Trading Game — Leader Dashboard</div>
    <button id="undoBtn" class="danger-btn">Undo last transaction</button>
  </header>

  <main>
    <section class="panel timer-panel">
      <div class="timer-panel-row">
        <div class="timer-display">
          <span id="gameTimerValue" class="timer-readout">00:00</span>
          <span id="gameTimerStatus" class="timer-status"></span>
        </div>
        <div class="timer-controls">
          <input id="timerMinutes" type="number" min="1" max="240" placeholder="Minutes" class="timer-minutes" />
          <button id="timerStartBtn" class="ghost-btn">Set &amp; start</button>
          <button id="timerPauseBtn" class="ghost-btn" hidden>Pause game</button>
          <button id="timerResumeBtn" class="ghost-btn" hidden>Resume game</button>
          <button id="timerStopBtn" class="danger-btn" hidden>Stop game</button>
          <button id="timerResetBtn" class="ghost-btn" hidden>Reset timer</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Game setup</h2>
      <div class="setup-label">Teams playing</div>
      <div id="teamsPlaying" class="teams-playing"></div>
      <div class="setup-actions">
        <button id="resetGameBtn" class="danger-btn">Reset game</button>
        <span class="empty-note">Puts every team back to its starting funds and clears all completions, hires, chits and the timer.</span>
      </div>
    </section>

    <section class="panel">
      <h2>Standings</h2>
      <table id="standingsTable" class="standings">
        <thead><tr><th>Team</th><th>Balance</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Tools on hire</h2>
      <table id="hiresTable" class="standings hires">
        <thead><tr><th>Tool</th><th>Team</th><th>Due</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="hiresEmpty" class="empty-note">Nothing out on hire.</div>
    </section>

    <section class="panel">
      <h2>Manual adjustment</h2>
      <form id="adjustmentForm" class="adjustment-form">
        <select id="adjTeam" required></select>
        <input id="adjAmount" type="number" placeholder="Amount (+/-)" required />
        <input id="adjNote" type="text" placeholder="Reason" />
        <button type="submit">Apply</button>
      </form>
    </section>

    <section class="panel">
      <h2>Live activity feed</h2>
      <div id="feed" class="feed"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/timer-client.js"></script>
  <script src="/shared/hire-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
